<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="astroBg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#12141c" />
      <stop offset="100%" stop-color="#05050a" />
    </linearGradient>
    <radialGradient id="astroGlow" cx="78%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#f2b73c" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f2b73c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#astroBg)" />
  <rect width="1600" height="1000" fill="url(#astroGlow)" />

  <!-- scattered stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="1.6" opacity="0.7" />
    <circle cx="260" cy="720" r="1.2" opacity="0.5" />
    <circle cx="180" cy="470" r="1.8" opacity="0.6" />
    <circle cx="400" cy="200" r="1.3" opacity="0.5" />
    <circle cx="90" cy="620" r="1.4" opacity="0.6" />
    <circle cx="1500" cy="180" r="1.6" opacity="0.6" />
    <circle cx="1420" cy="600" r="1.3" opacity="0.5" />
    <circle cx="1300" cy="820" r="1.8" opacity="0.6" />
    <circle cx="1540" cy="450" r="1.2" opacity="0.5" />
    <circle cx="1250" cy="120" r="1.4" opacity="0.55" />
    <circle cx="520" cy="850" r="1.2" opacity="0.45" />
    <circle cx="1100" cy="880" r="1.5" opacity="0.5" />
    <circle cx="720" cy="130" r="1.2" opacity="0.45" />
    <circle cx="900" cy="900" r="1.3" opacity="0.4" />
  </g>

  <!-- ringed accent, echoing the eclipse motif on the real site -->
  <circle cx="1350" cy="200" r="70" fill="none" stroke="#f2b73c" stroke-width="1.5" opacity="0.35" />

  <text x="800" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#f2b73c" letter-spacing="4px">
    AGRUPACIÓ ASTRONÒMICA · DESDE 1988
  </text>

  <text x="800" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="96" letter-spacing="-1px" xml:space="preserve">
    <tspan fill="#ffffff">ASTROFELS</tspan><tspan fill="#8a8f9c" font-weight="600"> Castelldefels</tspan>
  </text>

  <line x1="620" y1="600" x2="980" y2="600" stroke="#3a3d47" stroke-width="1.5" />

  <text x="800" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500" font-size="26" fill="#9a9fab">
    Astronomia per a tothom a Castelldefels
  </text>
</svg>
